name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Préparation du fichier d'environnement
      - name: Prepare environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # 2. Configuration Google Services (Firebase)
      - name: Setup Google Services configuration
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Création de app/google-services.json depuis le Secret GitHub GOOGLE_SERVICES_JSON..."
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "app/google-services.json non trouvé dans le dépôt, restauration automatique..."
            echo "" | base64 -d > app/google-services.json
          else
            echo "app/google-services.json déjà présent."
          fi

      # 3. Restauration du debug.keystore officiel (correspondant aux signatures Firebase)
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            echo "Restauration du debug.keystore depuis debug.keystore.base64..."
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
          else
            echo "Restauration du debug.keystore officiel embarqué..."
            echo "" | base64 -d > ~/.android/debug.keystore
          fi
          cp ~/.android/debug.keystore ./debug.keystore

      # 4. Compilation de l'APK Debug
      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      # 5. Extraction de la version et préparation des fichiers APK
      - name: Prepare APK file and version tags
        run: |
          mkdir -p release-apk
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n1 | cut -d '"' -f 2)
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n1 | tr -dc '0-9')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.3"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="4"; fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Préparation des APKs pour la version $VERSION_NAME (build $VERSION_CODE)..."
          cp app/build/outputs/apk/debug/*.apk release-apk/CineFamily.apk
          cp app/build/outputs/apk/debug/*.apk release-apk/CineFamily-v${VERSION_NAME}.apk

      # 6. Export de l'APK dans les Artifacts GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFamily-debug-apk
          path: release-apk/*.apk
          retention-days: 7

      # 7. Publication automatique dans les Releases GitHub avec version dédiée
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "CinéFamille v${{ env.VERSION_NAME }}"
          body: |
            ### 📱 CinéFamille v${{ env.VERSION_NAME }} (Version Code : ${{ env.VERSION_CODE }})
            
            **Nouveautés de cette version :**
            - 🎯 Sélecteur de soirée : choix par genre de film et par durée (Moins de 2h / + de 2h).
            - 🔒 Écran de connexion : interface épurée sans le cadre des codes PIN.
            - 🔑 Signature permanente unifiée pour des mises à jour directes sans désinstallation.
            
            **Installation :**
            Téléchargez le fichier **CineFamily-v${{ env.VERSION_NAME }}.apk** (ou **CineFamily.apk**) ci-dessous directement sur votre smartphone pour installer ou mettre à jour CinéFamille.
          draft: false
          prerelease: false
          files: |
            release-apk/CineFamily.apk
            release-apk/CineFamily-v${{ env.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
