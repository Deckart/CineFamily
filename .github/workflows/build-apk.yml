name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Préparation du fichier d'environnement
      - name: Prepare environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # 2. Restauration du debug.keystore officiel (correspondant aux signatures Firebase)
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            echo "Restauration du debug.keystore depuis debug.keystore.base64..."
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ./debug.keystore
          else
            echo "Génération de secours d'un debug.keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore ./debug.keystore
          fi

      # 3. Compilation de l'APK Debug
      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      # 4. Export de l'APK dans les Artifacts GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFamily-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
